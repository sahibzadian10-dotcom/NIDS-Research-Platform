<title>NIDS Research Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one sticky control bar (tabs + direction switch) over a single column of evidence cards.
   Colour roles: blue = same-dataset / source, orange = unseen dataset / target, red-blue diverging for SHAP sign. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface-2:#e8eef5; --ink:#0c1828; --ink-2:#44576f; --ink-3:#5b6c84;
  --line:#d3dce8; --line-2:#e5ebf2; --accent:#2a78d6; --on-accent:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s7:#6250d6; --s8:#e34948;
  --benign:#8a99ae; --pos:#e34948; --neg:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-bg:#fff4d6; --warn-line:#e9c25a;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b121d; --surface:#121b29; --surface-2:#1a2536; --ink:#e7edf6; --ink-2:#a8b5c8; --ink-3:#8392a8;
    --line:#26344a; --line-2:#1c283a; --accent:#3987e5; --on-accent:#ffffff;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s8:#e66767;
    --benign:#6f7f96; --pos:#e66767; --neg:#3987e5;
    --warn-bg:#2a2410; --warn-line:#6b5718; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b121d; --surface:#121b29; --surface-2:#1a2536; --ink:#e7edf6; --ink-2:#a8b5c8; --ink-3:#8392a8;
  --line:#26344a; --line-2:#1c283a; --accent:#3987e5; --on-accent:#ffffff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s8:#e66767;
  --benign:#6f7f96; --pos:#e66767; --neg:#3987e5;
  --warn-bg:#2a2410; --warn-line:#6b5718; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px}
h2{font-size:18px}
h3{font-size:14px}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding-block:20px 12px;flex-wrap:wrap}
.brand small{display:block;margin-top:4px;color:var(--ink-2);font-size:13px;max-width:70ch}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--ink-3)}
.notice{display:flex;gap:12px;background:var(--warn-bg);border:1px solid var(--warn-line);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.notice b{white-space:nowrap}

/* control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px;margin-inline:-4px;padding-inline:4px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink-2);font:500 13px var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}

/* layout */
main{padding-top:16px;display:grid;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h3+p,.card>h2+p{margin-top:4px}
.card .sub{color:var(--ink-2);font-size:13px;margin:4px 0 12px;max-width:75ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chart{width:100%;min-height:40px}
.chart svg{display:block;max-width:100%;overflow:visible}
.scroll{overflow-x:auto}

/* svg text */
svg .tx{font:11px var(--mono);fill:var(--ink-2)}
svg .tl{font:12px var(--sans);fill:var(--ink)}
svg .tv{font:500 11px var(--mono);fill:var(--ink)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--ink-3);stroke-width:1}
svg [data-tip]{cursor:default}

/* legend, chips */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chip.good::before{background:var(--good)} .chip.warn::before{background:var(--warn)} .chip.crit::before{background:var(--crit)} .chip.info::before{background:var(--accent)}
.gid{font:600 12px var(--mono);background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 8px;display:inline-block}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
td.r,th.r{text-align:right}
td.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
details.tv{margin-top:10px;font-size:12px;color:var(--ink-2)}
details.tv summary{cursor:pointer}

/* ledger */
.gap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.gap:first-child{border-top:0;padding-top:0}
.gap:last-child{padding-bottom:0}
.gap h3{margin:8px 0 4px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.mini>div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.mini .k{font:500 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.mini .v{font:500 20px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.mini .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;margin-top:8px}
.link:hover{text-decoration:underline}
@media (max-width:760px){.gap{grid-template-columns:1fr}}

/* findings */
.find{border-top:1px solid var(--line-2);padding:8px 0}
.find:first-child{border-top:0}
.find summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
.find p{margin:6px 0 0 44px;color:var(--ink-2);max-width:80ch}

/* explorer */
.sliders{display:grid;gap:10px}
.sl{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.sl output{font:500 13px var(--mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kpis>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpis .k{font:500 11px var(--mono);color:var(--ink-3);text-transform:uppercase}
.kpis .v{font:500 20px var(--mono);font-variant-numeric:tabular-nums}

/* tooltip */
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{font-weight:600}
#tip .m{font-family:var(--mono)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.steps>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.steps b{display:block;font-size:13px}
.steps span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.steps code,code{font:12px var(--mono);color:var(--ink-2)}
pre{margin:0;font:12px/1.55 var(--mono);background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px;max-width:88ch}
footer{margin-top:24px;color:var(--ink-3);font-size:12px}
@media (prefers-reduced-motion: no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--ink-3)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Research prototype · BS Computer Science · AWKUM</div>
      <h1>NIDS Research Platform</h1>
      <small id="proj"></small>
    </div>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch colour theme">Theme</button>
  </header>
  <div class="notice" role="note"><b>Simulated data.</b><span id="notice"></span></div>
  <nav class="bar" aria-label="Sections">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="ctl"><span>Direction</span><div class="seg" id="dirseg" role="group" aria-label="Transfer direction"></div></div>
  </nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
window.__R = /*__RESULTS__*/null;
(function(){
"use strict";
const R = window.__R;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = x => (x !== null && typeof x === 'object' && 'mean' in x) ? x.mean : x;
const S = x => (x !== null && typeof x === 'object' && 'std' in x) ? (x.std || 0) : 0;
const f2 = (v,d=2) => Number(v).toFixed(d);
const pct = (v,d=1) => (v*100).toFixed(d) + '%';
const int = v => Math.round(v).toLocaleString('en-US');
const pm = (x,d=3,sc=1) => `${(M(x)*sc).toFixed(d)} ± ${(S(x)*sc).toFixed(d)}`;

const DIRS = Object.keys(R.experiments);
const SH = {'UNSW-NB15':'UNSW','CIC-IDS2017':'CIC'};
const dl = k => k.split('->').map(s => SH[s]).join(' → ');
const CLS = R.meta.classes, ATT = R.meta.attack_classes, FEATS = R.meta.features;
const MODELS = Object.keys(R.meta.models);
const MLAB = {random_forest:'Random Forest', xgboost:'XGBoost-role boosted trees', mlp:'Compact MLP'};
const PLAB = {default_argmax:'Default arg-max', calibrated_argmax:'Calibrated arg-max', global_threshold:'Global threshold', per_class_cost:'Per-class (cost)', per_class_fpr_cap:'Per-class (FPR cap)'};
const POL = R.meta.policy_order;
const CCOL = {Benign:'var(--benign)', DoS:'var(--s2)', Recon:'var(--s3)', Exploit:'var(--s4)', Botnet:'var(--s5)'};
const DCOL = {'UNSW-NB15':'var(--s3)', 'CIC-IDS2017':'var(--s7)'};
const TABS = [['overview','Overview'],['data','Data'],['transfer','Transfer'],['alerts','Alert control'],['explain','Explanations'],['deploy','Deployment'],['stretch','Stretch'],['method','Method']];
const st = {tab:'overview', dir:0, model:'xgboost', policy:'default_argmax', tpolicy:'per_class_cost', feat:'FLOW_DURATION_MS', exi:0, preset:'per_class_cost', thr:null, dsfeat:'FLOW_DURATION_MS', dsgrp:'benign'};
const D = () => DIRS[st.dir];
const ev = (split, pol, model=st.model, dir=D()) => R.experiments[dir][model].eval[split][pol];

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e){
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(!t){ tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if(x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if(y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = Math.max(8,x) + 'px'; tip.style.top = Math.max(8,y) + 'px';
}
document.addEventListener('pointermove', showTip);
document.addEventListener('pointerdown', showTip);
document.addEventListener('scroll', () => { tip.hidden = true; }, true);
const T = (title, rows=[]) => esc(`<b>${title}</b>` + rows.map(r => `<br><span class="m">${r}</span>`).join(''));

/* ---------- chart kit (SVG strings, rendered at container width) ---------- */
let uid = 0, pending = [];
const ro = new ResizeObserver(es => { for(const en of es){ const el = en.target, w = Math.floor(en.contentRect.width); if(el._w !== w && el._go){ el._go(); } } });
function C(draw, cls=''){ const id = 'c' + (uid++); pending.push({id, draw}); return `<div class="chart ${cls}" id="${id}"></div>`; }
function mountAll(){
  pending.forEach(p => {
    const el = document.getElementById(p.id); if(!el) return;
    el._go = () => { const w = Math.max(260, Math.floor(el.clientWidth)); el._w = Math.floor(el.clientWidth); el.innerHTML = p.draw(w); };
    el._go(); ro.observe(el);
  });
  pending = [];
}
const tx = (x,y,s,o={}) => `<text x="${x}" y="${y}" class="${o.c||'tx'}" text-anchor="${o.a||'start'}">${s}</text>`;
const nice = v => { if(v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1 ? 1 : m <= 1.5 ? 1.5 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; };
const roundTop = (x,y,w,h,r) => { r = Math.min(r, h, w/2); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; };
const legend = items => `<div class="legend">${items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;

function barsV({w, h=250, groups, yMax, yFmt=v=>v.toFixed(1), valFmt, yTicks=4, label}){
  valFmt = valFmt || yFmt;
  const m = {l:46, r:8, t:18, b:48}, iw = w-m.l-m.r, ih = h-m.t-m.b, y = v => m.t + ih - (Math.max(0,v)/yMax)*ih;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||'bar chart')}">`;
  for(let i=0;i<=yTicks;i++){ const v = yMax*i/yTicks; s += `<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${y(v)}" y2="${y(v)}"/>` + tx(m.l-6, y(v)+4, yFmt(v), {a:'end'}); }
  const gw = iw/groups.length;
  groups.forEach((g,gi) => {
    const nb = g.bars.length, bw = Math.min(38, (gw*.74 - (nb-1)*3)/nb), tot = bw*nb + (nb-1)*3, x0 = m.l + gi*gw + (gw-tot)/2;
    g.bars.forEach((b,bi) => {
      const x = x0 + bi*(bw+3), top = y(b.v), hg = Math.max(0, m.t+ih-top);
      s += `<path d="${roundTop(x,top,bw,hg,3)}" style="fill:${b.color}" data-tip="${b.tip||''}"/>`;
      let lab = top;
      if(b.err){ const a = y(b.v+b.err), c = y(Math.max(0,b.v-b.err)), cx = x+bw/2; s += `<path d="M${cx},${a}V${c}M${cx-4},${a}H${cx+4}M${cx-4},${c}H${cx+4}" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`; lab = Math.min(lab,a); }
      s += tx(x+bw/2, lab-5, valFmt(b.v), {a:'middle', c:'tv'});
    });
    const parts = String(g.label).split('\n');
    parts.forEach((p,pi) => { s += tx(m.l + gi*gw + gw/2, h-m.b+16+pi*13, esc(p), {a:'middle', c:'tl'}); });
  });
  s += `<line class="axis" x1="${m.l}" x2="${w-m.r}" y1="${m.t+ih}" y2="${m.t+ih}"/></svg>`;
  return s;
}

function barsH({w, rows, xMax, xMin=0, xFmt=v=>v.toFixed(2), valFmt, ticks=4, xLog=false, labelW, mono=true}){
  valFmt = valFmt || xFmt;
  const lw = labelW || Math.min(150, Math.max(90, w*.34)), m = {l:lw, r:46, t:6, b:22}, iw = w-m.l-m.r;
  const sx = v => xLog ? iw*(Math.log10(Math.max(v,xMin))-Math.log10(xMin))/(Math.log10(xMax)-Math.log10(xMin)) : iw*(v/xMax);
  const bh = 13, gap = 3; let yy = m.t; const parts = [];
  rows.forEach(r => { const rh = r.vals.length*bh + (r.vals.length-1)*gap + 9; parts.push({r, y:yy, rh}); yy += rh; });
  const h = yy + m.b;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  const tk = xLog ? [0,1,2,3].map(i => xMin*Math.pow(10,i)).filter(v => v <= xMax*1.001) : Array.from({length:ticks+1}, (_,i) => xMax*i/ticks);
  tk.forEach(v => { s += `<line class="grid" x1="${m.l+sx(v)}" x2="${m.l+sx(v)}" y1="${m.t}" y2="${yy}"/>` + tx(m.l+sx(v), h-6, xFmt(v), {a:'middle'}); });
  parts.forEach(({r,y,rh}) => {
    s += tx(m.l-8, y + (rh-9)/2 + 4, esc(r.label), {a:'end', c: mono ? 'tx' : 'tl'});
    r.vals.forEach((v,i) => {
      const by = y + i*(bh+gap), bw = Math.max(1, sx(v.v));
      s += `<path d="M${m.l},${by}H${m.l+bw-3}Q${m.l+bw},${by} ${m.l+bw},${by+3}V${by+bh-3}Q${m.l+bw},${by+bh} ${m.l+bw-3},${by+bh}H${m.l}Z" style="fill:${v.color}" data-tip="${v.tip||''}"/>`;
      if(v.err){ const a = m.l+sx(Math.max(0,v.v-v.err)), b = m.l+sx(v.v+v.err), cy = by+bh/2; s += `<path d="M${a},${cy}H${b}M${a},${cy-3}V${cy+3}M${b},${cy-3}V${cy+3}" stroke="var(--ink)" stroke-width="1.2" fill="none"/>`; }
      s += tx(m.l+bw+(v.err?sx(v.v+v.err)-sx(v.v):0)+5, by+bh-2, valFmt(v.v), {c:'tv'});
    });
  });
  s += `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${yy}"/></svg>`;
  return s;
}

function lines({w, h=260, series, xd, yd, xticks, yticks=4, yFmt=v=>v.toFixed(2), xFmt=v=>v, xLog=false, diag=false, xLabel, yLabel, marks=[]}){
  const m = {l:50, r:16, t:12, b:xLabel?44:30}, iw = w-m.l-m.r, ih = h-m.t-m.b;
  const sx = v => m.l + (xLog ? iw*(Math.log10(Math.max(v,xd[0]))-Math.log10(xd[0]))/(Math.log10(xd[1])-Math.log10(xd[0])) : iw*(v-xd[0])/(xd[1]-xd[0]));
  const sy = v => m.t + ih - ih*(v-yd[0])/(yd[1]-yd[0]);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let i=0;i<=yticks;i++){ const v = yd[0]+(yd[1]-yd[0])*i/yticks; s += `<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${sy(v)}" y2="${sy(v)}"/>` + tx(m.l-6, sy(v)+4, yFmt(v), {a:'end'}); }
  xticks.forEach(t => { s += `<line class="grid" x1="${sx(t.v)}" x2="${sx(t.v)}" y1="${m.t}" y2="${m.t+ih}" style="stroke-dasharray:2 3"/>` + tx(sx(t.v), h-m.b+16, esc(t.label ?? xFmt(t.v)), {a:'middle'}); });
  if(diag) s += `<line x1="${sx(xd[0])}" y1="${sy(yd[0])}" x2="${sx(xd[1])}" y2="${sy(yd[1])}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>`;
  s += `<line class="axis" x1="${m.l}" x2="${w-m.r}" y1="${m.t+ih}" y2="${m.t+ih}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t+ih}"/>`;
  if(xLabel) s += tx(m.l+iw/2, h-6, esc(xLabel), {a:'middle'});
  series.forEach(se => {
    const pts = se.pts.filter(p => p.y !== null && p.y !== undefined);
    if(!se.noLine && pts.length > 1) s += `<path d="${pts.map((p,i) => (i?'L':'M') + sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join('')}" fill="none" stroke="${se.color}" stroke-width="2" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    pts.forEach(p => {
      if(p.err){ const a = sy(p.y+p.err), b = sy(Math.max(yd[0],p.y-p.err)), cx = sx(p.x); s += `<path d="M${cx},${a}V${b}M${cx-4},${a}H${cx+4}M${cx-4},${b}H${cx+4}" stroke="${se.color}" stroke-width="1.2" fill="none"/>`; }
      s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${p.r||4}" style="fill:${p.color||se.color}" stroke="var(--surface)" stroke-width="2" data-tip="${p.tip||''}"/>`;
      if(p.label) s += tx(sx(p.x)+7, sy(p.y)-6, esc(p.label), {c:'tx'});
    });
  });
  marks.forEach(mk => { s += `<circle cx="${sx(mk.x)}" cy="${sy(mk.y)}" r="8" fill="none" stroke="var(--ink)" stroke-width="2"/>` + `<circle cx="${sx(mk.x)}" cy="${sy(mk.y)}" r="3" style="fill:var(--ink)"/>`; });
  return s + '</svg>';
}

function heat({w, mat, rl, cl, tipFn}){
  const n = rl.length, lw = 70, top = 40, cell = Math.min(74, (w-lw-4)/n), h = top + n*cell + 8;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="confusion matrix">`;
  cl.forEach((c,j) => { s += tx(lw+j*cell+cell/2, top-8, esc(c), {a:'middle', c:'tl'}); });
  s += tx(lw+n*cell/2, 11, 'predicted', {a:'middle'});
  rl.forEach((r,i) => {
    const tot = mat[i].reduce((a,b) => a+b, 0) || 1;
    s += tx(lw-8, top+i*cell+cell/2+4, esc(r), {a:'end', c:'tl'});
    mat[i].forEach((v,j) => {
      const fr = v/tot, x = lw+j*cell, y = top+i*cell, hi = fr > .5;
      s += `<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="4" style="fill:var(--accent)" fill-opacity="${(0.05+0.9*fr).toFixed(3)}" data-tip="${tipFn(i,j,v,fr)}"/>`;
      s += `<text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" class="tv" style="fill:${hi?'var(--on-accent)':'var(--ink)'}">${(fr*100).toFixed(fr<.1&&fr>0?1:0)}%</text>`;
    });
  });
  s += `<text x="10" y="${top+n*cell/2}" class="tx" text-anchor="middle" transform="rotate(-90 10 ${top+n*cell/2})">true class</text>`;
  return s + '</svg>';
}

function waterfall({w, rows}){
  const lw = Math.min(190, w*.42), m = {l:lw, r:56, t:4}, iw = w-m.l-m.r, bh = 15, g = 6, h = m.t + rows.length*(bh+g) + 4;
  const mx = Math.max(...rows.map(r => Math.abs(r.v)), 1e-9), zero = m.l + iw/2, sx = v => (v/mx)*(iw/2);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="feature contributions">`;
  rows.forEach((r,i) => {
    const y = m.t + i*(bh+g), x = r.v >= 0 ? zero : zero + sx(r.v), bw = Math.max(1, Math.abs(sx(r.v)));
    s += tx(lw-8, y+bh-3, esc(r.label), {a:'end'});
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" style="fill:${r.v>=0?'var(--pos)':'var(--neg)'}" data-tip="${r.tip||''}"/>`;
    s += tx(r.v >= 0 ? zero+bw+5 : zero-bw-5, y+bh-3, (r.v>=0?'+':'−') + Math.abs(r.v).toFixed(3), {a: r.v>=0?'start':'end', c:'tv'});
  });
  s += `<line class="axis" x1="${zero}" x2="${zero}" y1="${m.t}" y2="${h-2}"/>`;
  return s + '</svg>';
}

function stack100({w, parts, h=34}){
  const tot = parts.reduce((a,p) => a+p.v, 0); let x = 0, s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  parts.forEach(p => { const pw = w*p.v/tot; s += `<rect x="${x+1}" y="0" width="${Math.max(0,pw-2)}" height="${h}" rx="4" style="fill:${p.color}" data-tip="${p.tip||''}"/>`; if(pw > 52) s += `<text x="${x+pw/2}" y="${h/2+4}" text-anchor="middle" class="tv" style="fill:#fff">${esc(p.label||'')}</text>`; x += pw; });
  return s + '</svg>';
}

let curveCache = {};
function runEx(di, t){
  const e = R.explorer[DIRS[di]], y = e.y, p = e.p, n = y.length, conf = new Array(25).fill(0);
  for(let i=0;i<n;i++){ const o = i*5; let best = -1, bi = 0; for(let c=1;c<5;c++){ const v = p[o+c]/1000; if(v >= t[c-1] && v > best){ best = v; bi = c; } } conf[y[i]*5+bi]++; }
  const rs = [], cs = []; for(let i=0;i<5;i++){ let r=0,c=0; for(let j=0;j<5;j++){ r += conf[i*5+j]; c += conf[j*5+i]; } rs.push(r); cs.push(c); }
  let f1s = 0; const rec = [];
  for(let i=0;i<5;i++){ const tp = conf[i*5+i], pr = cs[i] ? tp/cs[i] : 0, rc = rs[i] ? tp/rs[i] : 0; rec.push(rc); f1s += (pr+rc) ? 2*pr*rc/(pr+rc) : 0; }

}
function curve(di){

}

function fv(n, v){
  if(n === 'PROTOCOL') return ({6:'TCP',17:'UDP',1:'ICMP'})[v] || String(v);

  const u = {FLOW_DURATION_MS:'ms', IN_BYTES:'B', OUT_BYTES:'B', IN_PKTS:'pkt', OUT_PKTS:'pkt', MEAN_PKT_SIZE:'B', MEAN_IN_PKT_SIZE:'B', MEAN_OUT_PKT_SIZE:'B', BYTES_PER_SEC:'B/s', PKTS_PER_SEC:'pkt/s'}[n] || '';
  const s = Math.abs(v) >= 100 ? Math.round(v).toLocaleString('en-US') : Number(v).toFixed(2).replace(/\.?0+$/,'');
  return s + (u ? ' ' + u : '');
}

  return `${card('Pipeline','Five layers from the proposal. Data flows left to right; nothing from the target dataset reaches training, calibration or threshold selection.', `<div class="steps">${layers.map(l => `<div><b>${l[0]}</b><code>${l[1]}</code><span>${l[2]}</span></div>`).join('')}</div>`)}
  <div class="grid">
    ${card('Experiment configuration','Saved with every run so a number can be traced to its settings.', table(['Setting','Value'], [['Seeds', R.meta.seeds.join(', ')],['Split (grouped by session)', `test folds ${c.split.test_folds}, validation folds ${c.split.val_folds}`],['Flows per simulated dataset', `${int(c.n_flows['UNSW-NB15'])} / ${int(c.n_flows['CIC-IDS2017'])}`],['Dataset generator seed', c.dataset_seed],['Cost: false alert', ac.cost_fp],['Cost: missed attack', Object.entries(ac.cost_fn).map(([k,v]) => `${k} ${v}`).join(', ')],['Cost: wrong attack class', ac.cost_confusion],['FPR cap per class (source validation)', pct(ac.fpr_cap_per_class,2)],['Threshold grid', `${ac.grid_min}–${ac.grid_max}, step ${ac.grid_step}`],...hp]))}
    ${card('Reproducibility record','Everything needed to repeat or audit this run.', table(['Item','Value'], [['Generated', esc(R.meta.generated_at)],['Run time', f2(R.meta.runtime_s,0)+' s'],['Python', esc(env.python)],['scikit-learn / NumPy', esc(env.sklearn)+' / '+esc(env.numpy)],['CPUs', env.cpu_count],['Data mode', esc(R.meta.data_mode)],['UNSW file hash', `<code>${esc(R.meta.dataset_file_hashes['UNSW-NB15'])}</code>`],['CIC file hash', `<code>${esc(R.meta.dataset_file_hashes['CIC-IDS2017'])}</code>`]]))}
  </div>
  ${card('What this run does not show','Read before quoting any number.', `<ul class="clean">${lim}</ul>`)}
  ${card('Run it on the real datasets','Put the real CSV files in the dataset folders, switch the mode and rerun. The same code produces this dashboard from real results.', `<pre>pip install -r requirements.txt
# copy UNSW-NB15 CSVs  -> datasets/raw/UNSW-NB15/
# copy CIC-IDS2017 CSVs -> datasets/raw/CIC-IDS2017/
# delete the *_SIMULATED.csv files, then set "data_mode": "real" in the config
python run_experiments.py
python -m src.reporting.build_all</pre>`)}`;
}

/* ---------- shell ---------- */
const VIEWS = {overview:viewOverview, data:viewData, transfer:viewTransfer, alerts:viewAlerts, explain:viewExplain, deploy:viewDeploy, stretch:viewStretch, method:viewMethod};
const NEEDS_DIR = new Set(['transfer','alerts','explain','deploy']);
function render(){
  ro.disconnect(); pending = [];
  $('#tabs').innerHTML = TABS.map(([id,l]) => `<button class="tab" role="tab" type="button" data-tab="${id}" aria-selected="${id===st.tab}">${l}</button>`).join('');
  $('#dirseg').innerHTML = DIRS.map((k,i) => `<button type="button" data-act="dir" data-v="${i}" aria-pressed="${i===st.dir}">${dl(k)}</button>`).join('');
  $('#dirseg').parentElement.style.visibility = NEEDS_DIR.has(st.tab) ? 'visible' : 'hidden';
  $('#main').innerHTML = VIEWS[st.tab]();
  mountAll();
  bindExplorer();
}
function bindExplorer(){
  document.querySelectorAll('[data-thr]').forEach(inp => inp.addEventListener('input', () => {
    st.thr[+inp.dataset.thr] = +inp.value; st.preset = null; $('#thv-'+inp.dataset.thr).textContent = f2(inp.value,2);
    document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed','false'));
    $('#exout').innerHTML = expOut(); const c = document.querySelector('.curve'); if(c && c._go) c._go();
  }));
}
function go(tab){ st.tab = tab; try{ history.replaceState(null,'','#'+tab); }catch(e){ location.hash = tab; } render(); window.scrollTo({top:0}); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-act],[data-preset]'); if(!t) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.preset){ st.preset = t.dataset.preset; st.thr = R.explorer[D()].thresholds[st.preset].slice(); return render(); }
  const a = t.dataset.act, v = t.dataset.v;
  if(a === 'dir'){ st.dir = +v; st.thr = null; st.preset = 'per_class_cost'; st.exi = 0; }
  if(a === 'dsgrp') st.dsgrp = v;
  render();
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if(!s) return;
  const n = s.dataset.sel; st[n] = n === 'exi' ? +s.value : s.value; render();
});
$('#theme').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; try{ localStorage.setItem('nids-theme', r.dataset.theme); }catch(e){}
});
try{ const t = localStorage.getItem('nids-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$('#proj').textContent = R.meta.title + ' · ' + R.meta.authors.join(' & ') + ' · ' + R.meta.institution;
$('#notice').textContent = ' ' + R.meta.data_notice.replace(/^SIMULATED DATA\.\s*/, '');
$('#foot').textContent = `Generated ${R.meta.generated_at} · ${R.meta.seeds.length} seeds · ${R.meta.data_mode} data · every figure traces to experiments/results/results.json`;
const h = location.hash.replace('#',''); if(VIEWS[h]) st.tab = h;
window.addEventListener('hashchange', () => { const x = location.hash.replace('#',''); if(VIEWS[x] && x !== st.tab){ st.tab = x; render(); } });
render();
})();
</script>
